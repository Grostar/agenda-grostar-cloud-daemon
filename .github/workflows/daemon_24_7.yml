name: Agenda Grostar 24/7 Cloud Daemon

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  run-daemon:
    name: Agenda Grostar 24/7 Runner
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Europe/Madrid
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      TIMEZONE: Europe/Madrid
      MORNING_SUMMARY_HOUR: ${{ secrets.MORNING_SUMMARY_HOUR }}
      PORT: ${{ secrets.PORT || '8080' }}
      CLOUD_DAEMON_24_7: "true"
      RENDER: "false"

    steps:
      - name: Checkout Daemon Repository
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fast Watchdog Gatekeeper Check
        continue-on-error: true
        id: watchdog
        run: |
          python -u - << 'EOF'
          import json, os, urllib.error, urllib.request

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          pat = os.environ.get("GH_PAT") or os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("GITHUB_REPOSITORY", "Grostar/agenda-grostar-cloud-daemon")
          current_run_id = str(os.environ.get("GITHUB_RUN_ID", ""))
          skip = "false"

          if not pat:
              print("No GH_PAT found, skipping gatekeeper.")
          else:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/workflows/daemon_24_7.yml/runs?per_page=10",
                  headers={
                      "Authorization": f"Bearer {pat}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "Watchdog-Gatekeeper",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      other_runs = [
                          r for r in data.get("workflow_runs", [])
                          if str(r.get("id", "")) != current_run_id
                          and r.get("status") in ("in_progress", "queued", "waiting", "pending")
                      ]
                      if event == "schedule" and other_runs:
                          active_id = other_runs[0].get("id")
                          active_st = other_runs[0].get("status")
                          print(f"Watchdog: Ya existe un ciclo activo/en cola (ID={active_id}, status={active_st}). Saliendo en 1 segundo.")
                          skip = "true"
                      else:
                          print(f"Gatekeeper OK: Evento={event}, Ciclos activos previos={len(other_runs)}")
              except urllib.error.HTTPError as e:
                  print(f"Aviso HTTP en gatekeeper: {e}")
              except Exception as e:
                  print(f"Aviso en gatekeeper: {e}")

          gh_out = os.environ.get("GITHUB_OUTPUT")
          if gh_out:
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write(f"SKIP_RUN={skip}\n")
          EOF

      - name: Clone Agenda-Grostar Repository
        continue-on-error: true
        if: steps.watchdog.outputs.SKIP_RUN != 'true'
        run: |
          git config --global --add safe.directory "*"
          git config --global user.name "Grostar"
          git config --global user.email "Grostar888@gmail.com"
          for i in 1 2 3; do rm -rf agenda_app && git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/Grostar/Agenda-Grostar.git agenda_app && break || sleep 3; done
          mkdir -p agenda_app

      - name: Install Dependencies
        continue-on-error: true
        if: steps.watchdog.outputs.SKIP_RUN != 'true'
        run: |
          python -m pip install --upgrade pip -q
          pip install -r agenda_app/requirements.txt -q

      - name: Run 24/7 Cloud Daemon Supervisor
        continue-on-error: true
        if: steps.watchdog.outputs.SKIP_RUN != 'true'
        run: |
          python -u supervisor.py

      - name: Failover Backup Relay Check
        continue-on-error: true
        if: always() && steps.watchdog.outputs.SKIP_RUN != 'true'
        run: |
          python -u - << 'EOF'
          import json, os, urllib.request

          pat = os.environ.get("GH_PAT") or os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("GITHUB_REPOSITORY", "Grostar/agenda-grostar-cloud-daemon")
          current_run_id = str(os.environ.get("GITHUB_RUN_ID", ""))

          if pat:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/workflows/daemon_24_7.yml/runs?per_page=10",
                  headers={
                      "Authorization": f"Bearer {pat}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "Failover-Backup",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                      active_or_queued = [
                          r for r in data.get("workflow_runs", [])
                          if str(r.get("id", "")) != current_run_id
                          and r.get("status") in ("in_progress", "queued", "waiting", "pending")
                      ]
                      if not active_or_queued:
                          print("Failover: No hay ningún ciclo activo ni en cola. Relanzando relevo de emergencia...")
                          dispatch_req = urllib.request.Request(
                              f"https://api.github.com/repos/{repo}/actions/workflows/daemon_24_7.yml/dispatches",
                              data=json.dumps({"ref": "main"}).encode("utf-8"),
                              headers={
                                  "Authorization": f"Bearer {pat}",
                                  "Accept": "application/vnd.github+json",
                                  "Content-Type": "application/json",
                                  "User-Agent": "Failover-Backup",
                              },
                              method="POST",
                          )
                          urllib.request.urlopen(dispatch_req, timeout=10)
                          print("Failover: Disparado nuevo ciclo con éxito.")
                      else:
                          relay_id = active_or_queued[0].get("id")
                          print(f"Failover: Ya existe ciclo activo/en cola ({relay_id}). No es necesario relanzar.")
              except Exception as e:
                  print(f"Error en failover check: {e}")
          EOF
